[project]
name = "malaria-prediction-peru"
version = "0.1.0"
description = "Plataforma de alerta temprana de malaria para Peru (prediccion de casos y riesgo de brote por distrito x semana epidemiologica)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "mlflow>=2.16",
    "joblib>=1.4",
    "shap>=0.46",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27", # requerido por fastapi.testclient.TestClient (tests/unit/test_api.py)
]
monitoring = [
    "scipy>=1.14",
]
# Solo necesario para pipelines/reference/build_district_adjacency.py y
# build_department_centroids.py (pasos de referencia que se corren una vez,
# no en cada entrenamiento/inferencia).
geo = [
    "shapely>=2.1",
]
# Etapa 2 del rediseno ML (Temporal Fusion Transformer + clima, ver
# docs/architecture.md). Aparte de dev/monitoring/geo porque instala
# pytorch (pesado, ~2GB) y solo hace falta para esta etapa, no para
# ingesta/Etapa 1/API.
dl = [
    "torch>=2.4",
    "pytorch-forecasting>=1.2",
    "lightning>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "pipelines*", "api*"]

[tool.ruff]
line-length = 100
# Los notebooks .ipynb en la raiz (del commit inicial del repo, ver README)
# se excluyen del lint porque no son codigo de produccion.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Los fixtures de test con CSV crudo como string literal a veces superan
# el limite de linea; no vale la pena partir esas cabeceras artificialmente.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
