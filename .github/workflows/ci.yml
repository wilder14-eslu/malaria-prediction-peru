# CI: calidad de codigo, tests y verificacion de la imagen Docker de la API.
# Se ejecuta en cada push y pull request a main (y manualmente desde la
# pestana Actions). El badge del README refleja el estado de este workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy src api

      - name: Tests (pytest + cobertura)
        run: pytest -q --cov=src --cov=api --cov=pipelines --cov-report=term-missing

      - name: Smoke test de la API (uvicorn)
        run: |
          uvicorn api.main:app --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/predict/160101 > /dev/null
          echo "API OK"

  docker:
    name: Build y smoke test de la imagen Docker
    runs-on: ubuntu-latest
    needs: quality-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen
        run: docker build -t malaria-api:ci .

      - name: Levantar el contenedor y probar /health y /predict
        run: |
          docker run -d --name malaria-api -p 8000:8000 malaria-api:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/predict/160101 > /dev/null
          echo "Contenedor OK"

      - name: Logs del contenedor (si falla)
        if: failure()
        run: docker logs malaria-api